# Azure DevOps equivalent of the Jenkins performance stage.
trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

steps:
  - script: |
      sudo apt-get update && sudo apt-get install -y jmeter
      jmeter -n -t tests/load_test.jmx -l results.jtl
    displayName: Run JMeter test

  - script: python3 demos/cicd/check_thresholds.py results.jtl --p95 2000 --error-rate 1.0
    displayName: Performance gate

  - publish: results.jtl
    artifact: jmeter-results
    condition: always()
